[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "coreference-resolution-claim-audit"
version = "0.1.0"
description = "Offline documentation claim auditor for mention linking"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"

[project.scripts]
coreference-resolution-claim-audit = "coreference_resolution_claim_audit.audit:main"

[tool.setuptools.packages.find]
include = ["coreference_resolution_claim_audit*"]
